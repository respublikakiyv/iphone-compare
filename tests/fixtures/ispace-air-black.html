т!\u003C\u002Fp>\u003Cbr>\u003Ch3>Розширена гарантія - це:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у будь-якому гарантійному випадку\u003C\u002Fp>\u003Cp>✓ Необмежена кількість звернень щодо гарантійних поломок\u003C\u002Fp>\u003Cp>✓ Компенсація 100% вартості, якщо пристрій неможливо відремонтувати\u003C\u002Fp>\u003Cp>✓ Швидкі терміни обслуговування: діагностика — до 5 календарних днів, ремонт — до 14 календарних днів*\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ТА ОБМІН ГАДЖЕТА:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у разі механічного пошкодження або потрапляння рідини\u003C\u002Fp>\u003Cp>✓ Якщо пристрій не пошкоджено протягом року — сертифікат магазину на \u003Cstrong>70% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Якщо ремонт неможливий — сертифікат магазину на \u003Cstrong>50% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Термін дії — 1 або 2 роки з дати придбання\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ДИСПЛЕЯ ТА ЗАДНЬОЇ КРИШКИ iPhone:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Заміна пошкодженого дисплея на новий\u003C\u002Fp>\u003Cp>✓ Заміна пошкодженої задньої скляної панелі\u003C\u002Fp>\u003Cbr>\u003Cp>Ремонт проводиться виключно в авторизованих сервісних центрах Apple iSpace з використанням лише оригінальних запчастин\u003C\u002Fp>\u003Cbr>\u003Cp>*Терміни діагностики та ремонту діють після завершення воєнного стану. Пошкодження від рідини не покривається програмою Захист дисплея.\u003C\u002Fp>","Розширена гарантія від механічних пошкоджень",{"id":840,"type":841,"contentType":841,"data":842,"sort":44},1194227,"asbis-ui",{"data":843,"type":867,"component":12},{"id":844,"items":845,"title":862,"columns":29,"spacing":863,"textAlign":865,"expandMode":866,"description":12,"analyticsPlacement":12},"FaqSectionSimple",[846,850,854,858],{"tags":847,"answer":848,"question":849},[],"Так, iSpace — офіційний преміум-реселер Apple в Україні, тому ви можете купити iPhone Air, 256 ГБ, Space Black з гарантією від виробника.","Чи є офіційна гарантія Apple в Україні?",{"tags":851,"answer":852,"question":853},[],"Так, в iSpace ми пропонуємо програми розстрочки під 0% без переплат на різні терміни.","Чи можна купити в розстрочку?",{"tags":855,"answer":856,"question":857},[],"Так, можливий самовивіз або доставка в будь-яке місто України. \u003Ca href=\"https:\u002F\u002Fispace.ua\u002Fpayment-delivery\">Детальніше про терміни та вартість доставки.\u003C\u002Fa>","Чи доступна доставка по Україні?",{"tags":859,"answer":860,"question":861},[],"Так, в iSpace лише оригінальна техніка Apple. Ми є офіційним реселером, тому гарантуємо справжність пристроїв і надаємо офіційну гарантію.","Чи оригінальний iPhone Air?","\u003Cspan style=\"color: rgb(23, 43, 77);font-size: 16px;letter-spacing: normal;\">\u003Cstrong>Питання та відповіді\u003C\u002Fstrong>\u003C\u002Fspan>",{"top":864,"bottom":864},"md","center","single","faq-section-simple",{"id":869,"type":870,"contentType":830,"data":871,"sort":49},798210,"family-stripe",{"items":872},[873,876,878,880,882,884,885,887,889,891,893,895,896],{"entityId":874,"entityType":875},1436069,"product",{"entityId":877,"entityType":875},1436475,{"entityId":879,"entityType":875},1285072,{"entityId":881,"entityType":875},1042645,{"entityId":883,"entityType":875},1042670,{"entityId":669,"entityType":875},{"entityId":886,"entityType":875},895193,{"entityId":888,"entityType":875},893752,{"entityId":890,"entityType":875},893627,{"entityId":892,"entityType":875},895595,{"entityId":894,"entityType":875},895460,{"entityId":888,"entityType":875},{"entityId":897,"entityType":665},53425,{"id":899,"type":900,"contentType":830,"data":901,"sort":227},798571,"tooltip",[902],{"text":903,"featureName":718},"\u003Ch2>Як дізнатися, скільки пам’яті ви використовуєте.\u003C\u002Fh2>\u003Cbr>\u003Cp>На вашому iPhone перейдіть у «Налаштування» > «Основні» > «Сховище iPhone», щоб дізнатися, скільки пам’яті ви використовуєте, як ви її використовуєте та скільки залишилось. На інших смартфонах перей
