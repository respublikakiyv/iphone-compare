             \u003Cli class=\"v250DA8\" role=\"listitem\">\r\n                \u003Cdiv class=\"row h7C685D large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column f7CD825 large-12\">\u003Cp class=\"copy z484AA8 channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Up to 50% Charge in 30 Minutes:\u003C\u002Fspan> Testing conducted by Apple in August and September 2025 using preproduction iPad&nbsp;Pro&nbsp;11‑inch (M5) and iPad&nbsp;Pro&nbsp;13‑inch (M5) units, and USB‑C Charge Cable with Apple 40W Dynamic Power Adapter with 60W Max (Model&nbsp;A3351) or Apple 70W USB‑C Power Adapter (Model&nbsp;A2305). Fast‑charge testing conducted with drained iPad&nbsp;Pro units. Times measured from the appearance of the Apple\r\n                      logo as the unit started up. Charge time varies with settings and environmental factors; actual results will vary.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"pED348F\" role=\"listitem\">\r\n                \u003Cdiv class=\"row r025EF6 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column qB4F89A large-12\">\u003Cp class=\"copy rA8E54D channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Display:\u003C\u002Fspan> The displays have rounded corners. When measured diagonally as a rectangle, the 13‑inch iPad&nbsp;Pro is 13 inches, the 11‑inch iPad&nbsp;Pro is 11.1 inches, the 13‑inch iPad&nbsp;Air is 12.9 inches, the 11‑inch iPad&nbsp;Air and iPad&nbsp;(A16) are 10.86 inches, and the 8.3‑inch iPad&nbsp;mini is 8.3 inches. Actual viewable area is less.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"xEC2D93\" role=\"listitem\">\r\n                \u003Cdiv class=\"row o13E07A large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column eE68E8C large-12\">\u003Cp class=\"copy iB903F5 channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\u003Cspan style=\"font-weight: 500\">Accessories:\u003C\u002Fspan> Accessories sold separately and subject to availability. Compatibility varies by generation. Apple&nbsp;Pencil (1st generation) requires USB‑C to Apple&nbsp;Pencil Adapter to work with iPad&nbsp;(A16) and iPad&nbsp;(10th generation).\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"y29E314\" role=\"listitem\">\r\n                \u003Cdiv class=\"row o2B75A2 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column tA56F7F large-12\">\u003Cp class=\"copy n44DAD6 channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\u003Cspan style=\"font-weight: 500\">Wi-Fi 7:\u003C\u002Fspan> Available in countries and regions where supported.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"q829EE3\" role=\"listitem\">\r\n                \u003Cdiv class=\"row s2F2A4B large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column u28E0E1 large-12\">\u003Cp class=\"copy vB68A8B channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\r\n                      \u003Cspan style=\"font-weight: 500\">5G Cellular:\u003C\u002Fspan> Data plan required. 5G is available in select markets and through select carriers. Speeds vary based on site conditions and carrier. For details on 5G support, contact your carrier and see \u003Ca href=\"https:\u002F\u002Fapple.com\u002Fipad\u002Fcellular\u002F\" class=\"footer-link\">\u003Cspan style=\"color: #424245; white-space: nowrap\">apple.com\u002Fipad\u002Fcellular\u003C\u002Fspan>\u003C\u002Fa>.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"j84535C\" role=\"listitem\">\r\n                \u003Cdiv class=\"row lAEE348 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column o85425F large-12\">\u003Cp class=\"copy yE2F2AF channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">Capacity:\u003C\u002Fspan> Actual formatted capacity is less and varies due to many factors. Storage capacity subject to change based on software version, settings, and iPad model. 1GB = 1 billion bytes; 1TB = 1 trillion bytes.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"d5BD432\" role=\"listitem\">\r\n                \u003Cdiv class=\"row oC01796 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column k927B48 large-12\">\u003Cp class=\"copy b755E77 channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\u003Cspan style=\"font-weight: 500\">Feature Availability:\u003C\u002Fspan> Features are subject to change. Some features, applications, and services may not be available in all regions or all languages.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n            \u003C\u002Ful>\r\n          \u003C\u002Faside>\r\n        \u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fdiv>\r\n    \u003C!--END > LEGAL-->\r\n\u003Clink href=\"https:\u002F\u002Fcf.value4it.com\u002Fshare\u002Fcommon\u002Frc\u002FApple\u002FiPad_Pro_M5\u002FCSS\u002Fstyles.css\" rel=\"stylesheet\" \u002F>",{"id":804,"type":805,"contentType":806,"data":807,"sort":29},837176,"short_description","json","iPad Pro, оснащений чипом M5 від Apple, забезпечує надзвичайну продуктивність для легкої роботи та вдосконалених робочих процесів на основі штучного інтелекту. Завдяки приголомшливому дисплею Ultra Retina XDR, надшвидкому Wi-Fi 71 і підтримці 5G,2 прискорювачам Neural Accelerator для оброблення завдань штучного інтелекту й оновленій операційній системі iPadOS можливості iPad Pro необмежені. У парі з Apple Pencil Pro та клавіатурою Magic Keyboard для iPad Pro він забезпечує неймовірну універсальність, креативність і продуктивність у ваших руках.",{"id":809,"type":810,"contentType":806,"data":811,"sort":34},1101396,"learn_more_insurance",{"link":12,"text":812,"title":813,"nameLink":12},"\u003Cp>Обирайте розширену гарантію від iSpace та користуйтеся пристроєм без зайвих турбот!\u003C\u002Fp>\u003Cbr>\u003Ch3>Розширена гарантія - це:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у будь-якому гарантійному випадку\u003C\u002Fp>\u003Cp>✓ Необмежена кількість звернень щодо гарантійних поломок\u003C\u002Fp>\u003Cp>✓ Компенсація 100% вартості, якщо пристрій неможливо відремонтувати\u003C\u002Fp>\u003Cp>✓ Швидкі терміни обслуговування: діагностика — до 5 календарних днів, ремонт — до 14 календарних днів*\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ТА ОБМІН ГАДЖЕТА:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у разі механічного пошкодження або потрапляння рідини\u003C\u002Fp>\u003Cp>✓ Якщо пристрій не пошкоджено протягом року — сертифікат магазину на \u003Cstrong>70% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Якщо ремонт неможливий — сертифікат магазину на \u003Cstrong>50% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Термін дії — 1 або 2 роки з дати придбання\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ДИСПЛЕЯ ТА ЗАДНЬОЇ КРИШКИ iPhone:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Заміна пошкодженого дисплея на новий\u003C\u002Fp>\u003Cp>✓ Заміна пошкодженої задньої скляної панелі\u003C\u002Fp>\u003Cbr>\u003Cp>Ремонт проводиться виключно в авторизованих сервісних центрах Apple iSpace з використанням лише оригінальних запчастин\u003C\u002Fp>\u003Cbr>\u003Cp>*Терміни діагностики та ремонту діють після завершення воєнного стану. Пошкодження від рідини не покривається програмою Захист дисплея.\u003C\u002Fp>","Розширена гарантія від механічних пошкоджень",{"id":815,"type":816,"contentType":816,"data":817,"sort":39},1194276,"asbis-ui",{"data":818,"type":842,"component":12},{"id":819,"items":820,"title":837,"columns":29,"spacing":838,"textAlign":840,"expandMode":841,"description":12,"analyticsPlacement":12},"FaqSectionSimple",[821,825,829,833],{"tags":822,"answer":823,"question":824},[],"Так, iSpace — офіційний преміум-реселер Apple в Україні, тому ви можете купити iPad Pro 11 M5, 256 ГБ Wi-Fi+4G Стандартне скло 2025, Space Black з гарантією від виробника.","Чи є офіційна гарантія Apple в Україні?",{"tags":826,"answer":827,"question":828},[],"Так, в iSpace ми пропонуємо програми розстрочки під 0% без переплат на різні терміни.","Чи можна купити в розстрочку?",{"tags":830,"answer":831,"question":832},[],"Так, можливий самовивіз або доставка в будь-яке місто України. \u003Ca href=\"https:\u002F\u002Fispace.ua\u002Fpayment-delivery\">Детальніше про терміни та вартість доставки.\u003C\u002Fa>","Чи доступна доставка по Україні?",{"tags":834,"answer":835,"question":836},[],"Так, в iSpace лише оригінальна техніка Apple. Ми є офіційним реселером, тому гарантуємо справжність пристроїв і надаємо офіційну гарантію.","Чи оригінальний Pad Pro 11?","\u003Cspan style=\"color: rgb(23, 43, 77);font-size: 16px;letter-spacing: normal;\">\u003Cstrong>Питання та відповіді\u003C\u002Fstrong>\u003C\u002Fspan>",{"top":839,"bottom":839},"md","center","single","faq-section-simple",{"id":844,"type":845,"contentType":806,"data":846,"sort":44},834719,"delivery",[847,851,855,859],{"icon":848,"name":849,"details":850},"\u002Fcms\u002Fstatic-pages\u002Fd1\u002F87\u002Fd1879e182e5ad7b0c434d056bd338fe3\u002Fic_insurance_2.webp","Офіційна гарантія до 12 місяців","Надаємо лише оригінальну техніку з офіційною гарантією та підтримкою. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Fguarantee'>Детальніше",{"icon":852,"name":853,"details":854},"\u002Fcms\u002Fstatic-pages\u002F5a\u002F85\u002F5a8586fc2e067d0ead693cf13397dc02\u002Fic_services.webp","Усе для вашого пристрою","Допоможемо підібрати аксесуари, захист і сервіси одразу разом із пристроєм. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Faccessories'>Переглянути аксесуари",{"icon":856,"name":857,"details":858},"\u002Fcms\u002Fstatic-pages\u002F8b\u002F8f\u002F8b8f4e2c89a6c46b1c0cb815451936ba\u002Fic_returnrefund.webp","Налаштування при покупці","Підготуємо пристрій до використання одразу після покупки. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Fcategory\u002Fservices'>Наші послуги",{"icon":860,"name":861,"details":862},"\u002Fcms\u002Fstatic-pages\u002F28\u002Fb5\u002F28b5baee534ad193921eee20eb893faa\u002Fic_trade_in.webp","Підтримка після покупки","Допоможемо розібратися з функціями пристрою та впевнено користуватися ним після покупки.",{"id":864,"type":865,"contentType":806,"data":866,"sort":49},990910,"tooltip",[867,869],{"text":868,"featureName":727},"\u003Ch2>Звільніть місце для всього.\u003C\u002Fh2>\u003Cbr>\u003Cp>Скільки пам’яті вам потрібно, залежить від того, як ви використовуєте iPad. Більше пам’яті означає, що ви можете зберігати більше додатків, музики, фільмів і книг. Це також дозволяє зберігати RAW-зображення, 4K-відео, 3D-рендери, ілюстрації та інші великі файли.\u003C\u002Fp>\u003Cbr>\u003Cp>З часом ви можете додавати більше контенту на свій iPad, тому важливо враховувати, як можуть змінюватися ваші потреби у сховищі.\u003C\u002Fp>\u003Cbr>\u003Cp style=\"color: #bec4ce;\">Пам’ять вимірюється в гігабайтах (GB) і терабайтах (TB).\u003Cbr>Примітка: Доступний простір менший і може відрізнятися через багато факторів. Ємність сховища може змінюватися залежно від версії програмного забезпечення, налаштувань і моделі iPad. 1GB = 1 мільярд байтів; 1TB = 1 трильйон байтів. Фактична відформатована ємність менша.\u003C\u002Fp>",{"text":870,"featureName":871},"\u003Ch2>Дізнайтеся більше про модель Wi-Fi + Cellular.\u003C\u002Fh2>\u003Cbr>\u003Ch3>Швидше бездротове з’єднання з Wi-Fi 6E.\u003C\u002Fh3>\u003Cbr>\u003Cp>iPad Pro підтримує технологію Wi-Fi 6E для швидкого підключення до мереж Wi-Fi у вас вдома, у кав’ярні, шкільній бібліотеці або в аеропорту.*\u003C\u002Fp>\u003Cbr>\u003Ch3>Залишайтеся на зв’язку будь-де з мобільними даними.\u003C\u002Fh3>\u003Cbr>\u003Cp>- Технологія eSIM дозволяє легко налаштувати підключення до мобільних даних прямо з вашого iPad Pro без довгострокових зобов’язань.** Або ви можете просто вставити SIM-картку, активовану вашим оператором зв’язку.\u003C\u002Fp>\u003Cbr>\u003Cp>- Переглядайте вебсторінки, надсилайте електронні листи та текстові повідомлення, отримуйте доступ до своїх файлів та багато іншого. Усе це — у дорозі.\u003C\u002Fp>\u003Cbr>\u003Cp>- Залишайтеся на зв’язку з друзями та родиною. Або співпрацюйте з колегами.\u003C\u002Fp>\u003Cbr>\u003Cp>- Отримуйте надшвидке покриття 5G і LTE від вибраних операторів зв’язку.\u003C\u002Fp>\u003Cbr>\u003Cp>- Додавайте мобільні дані під час подорожей і залишайтеся на зв’язку в понад 180 країнах і регіонах.\u003C\u002Fp>\u003Cbr>\u003Cp>- Обирайте серед різних партнерів-операторів або додавайте до свого чинного тарифного плану.\u003C\u002Fp>\u003Cbr>\u003Cp style=\"color: #bec4ce;\">* Wi-Fi 6E недоступний у материковому Китаї.\u003C\u002Fp>\u003Cbr>\u003Cp style=\"color: #bec4ce;\">** Не всі оператори підтримують eSIM. Зверніться до свого оператора для отримання детальної інформації. Технологія eSIM сумісна з iPad Pro 11-дюймів (1-го покоління або новіше), iPad Pro 12,9-дюймів (3-го покоління або новіше), iPad Air (3-го покоління або новіше), iPad (7-го покоління або новіше) та iPad mini (5-го і 6-го покоління). eSIM доступна в Китаї лише для iPad (10-го покоління).\u003C\u002Fp>","CONNECTIVITY",{"id":873,"type":874,"contentType":806,"data":875,"sort":227},1200478,"learn_more_warranty",{"link":12,"text":876,"title":474,"nameLink":12},"\u003Cp>\u003Cstrong>Продовження заводської гарантії Apple на 1 додатковий рік після закінчення стандартної гарантії.\u003C\u002Fstrong> Захист поширюється на виробничі несправності, не пов'язані з використанням пристрою або зовнішніми впливами.\u003C\u002Fp>\u003Cp>\u003Cstrong>Обслуговування за програмою продовженої гарантії здійснюється лише в мережі iSpace Ukraine.\u003C\u002Fstrong> Протягом терміну дії програми передбачено один гарантійний випадок.\u003C\u002Fp>",{"id":878,"type":879,"contentType":806,"data":880,"sort":174},835088,"promo-carousel",{"isAddToCart":577,"categoryPromo":881},"quick-conversion-modules-ipad-pro-11-13",{"id":883,"type":884,"contentType":806,"data":885,"sort":54},834773,"slogan","Продуктивний і портативний.",{"id":887,"type":888,"contentType":806,"data":889,"sort":183},834887,"custom_badges","\u003Cspan style='color:#BF4800'>НОВИНКА\u003C\u002Fspan>",{"id":891,"type":892,"contentType":806,"data":893,"sort":188},834986,"compare_link","https:\u002F\u002Fispace.ua\u002Fshare\u002Fcommon\u002Frc\u002FApple\u002FCompare_Page\u002FHTML_Compare_Module_iPad\u002FUA\u002FCompare_iPad_UA_2026_current..html",{"id":895,"type":896,"contentType":806,"data":897,"sort":193},834833,"family-stripe",{"items":898},[899,902,903,905,907,909,911,913,915,917,919,921,923,925],{"entityId":900,"entityType":901},1089592,"product",{"entityId":668,"entityType":901},{"entityId":904,"entityType":901},1285123,{"entityId":906,"entityType":901},1285081,{"entityId":908,"entityType":901},891331,{"entityId":910,"entityType":901},895763,{"entityId":912,"entityType":901},893733,{"entityId":914,"entityType":901},892182,{"entityId
