s=\"ispc-col\">\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">\r\n                  ЧОТИРИ ВИРАЗНІ КОЛЬОРИ. ОДИН НАДІЙНИЙ КОРПУС.\r\n                \u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\" style=\"max-width:96.1%\">\r\n                  Створений надовго завдяки цільному алюмінієвому корпусу зі\r\n                  скляною задньою панеллю такого самого кольору — для більш\r\n                  гармонійного вигляду.\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">ІМЕРСИВНИЙ ПРОФЕСІЙНИЙ ДИСПЛЕЙ.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\">\r\n                  Дисплей Super Retina XDR 6,9 дюйма.\u003Cspan class=\"ispc-sup\">1\u003C\u002Fspan>\r\n                  Яскравіший. З кращим противідблисковим покриттям. Технологія ProMotion до 120 Гц.\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">\r\n                  МІЦНА ПАНЕЛЬ CERAMIC SHIELD. І СПЕРЕДУ, І ЗЗАДУ.\r\n                \u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\" style=\"max-width:96.96%\">\r\n                  Створений надовго завдяки задній панелі Ceramic Shield і\r\n                  передній панелі Ceramic Shield 2, утричі стійкішій до\r\n                  подряпин, ніж в iPhone 16 Pro.\u003Cspan class=\"ispc-sup\">2\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">ДОСКОНАЛА СИСТЕМА КАМЕР PRO.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\" style=\"max-width:96.33%\">\r\n                  Основна камера Fusion 48&nbsp;Mп зі змінною діафрагмою для ще\r\n                  кращих фото й відео за умов слабког 2Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">НАДВАЖЛИВІ ФУНКЦІЇ БЕЗПЕКИ.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\">\r\n                  За допомогою функції «Виявлення аварій» iPhone може\r\n                  розпізнавати серйозні автомобільні аварії та викликати\r\n                  допомогу, коли ви не в змозі.\u003Cspan class=\"ispc-sup\">6\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">БУДЬТЕ НА ЗВ’ЯЗКУ МАЙЖЕ ВСЮДИ.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\">\r\n                  Користуйтеся швидшим зв’язком завдяки захищеним підключенням\r\n                  до мереж Wi-Fi 7,\u003Cspan class=\"ispc-sup\">7\u003C\u002Fspan> 5G\u003Cspan class=\"ispc-sup\">8\u003C\u002Fspan>\r\n                  та Bluetooth 6.\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">ESIM. ГНУЧКІСТЬ. БЕЗПЕКА. ЗРУЧНІСТЬ.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\">\r\n                  Інтегрована eSIM забезпечує захищене підключення без фізичної\r\n                  SIM-картки — ідеальний варіант для міжнародних подорожей.\u003Cspan class=\"ispc-sup\">9\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-it\">\r\n                \u003Cdiv class=\"ispc-it__t\">КОНФІДЕНЦІЙНІСТЬ.\u003C\u002Fdiv>\r\n                \u003Cdiv class=\"ispc-it__d\">\r\n                  За допомогою Face ID можна безпечно розблоковувати телефон,\r\n                  входити в обліковий запис і здійснювати оплату.\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n        \u003C\u002Fdiv>\r\n        \u003Cdiv class=\"ispc-fr\" style=\"margin-top:clamp(35.25px,12.958cqw,155.5px)\">\r\n          \u003Cimg src=\"https:\u002F\u002Fcf.value4it.com\u002Fshare\u002Fcommon\u002Frc\u002FApple\u002FiPhone_18_Pro\u002FCustom-rc\u002F123.webp\" alt=\"Комплект постачання: iPhone 18 Pro Max та зарядний кабель USB-C\">\r\n          \u003Cdiv class=\"ispc-o ispc-o15\">Що в коробці\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"ispc-o ispc-o16\">iPhone 18 Pro\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"ispc-o ispc-o17\">Зарядний кабель USB-C\u003C\u002Fdiv>\r\n        \u003C\u002Fdiv>\r\n        \u003Cdiv class=\"ispc-lg\">\r\n          \u003Cdiv class=\"ispc-lg__t\">Технічні характеристики\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"ispc-lg__p ispc-lg__m1\">\r\n            Повний перелік технічних характеристик можна переглянути на\r\n            \u003Cspan class=\"ispc-u\">apple.com\u002Fiphone\u002Fcoеmpare\u003C\u002Fspan>.\r\n          \u003C\u002Fdiv>\r\n          \u003Cdiv class=\"ispc-lg__t ispc-lg__m2\">Юридична інформація\u003C\u002Fdiv>\r\n          \u003Cdiv class=\"ispc-lg__cols\">\r\n            \u003Cdiv class=\"ispc-lg__col\">\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">1\u003C\u002Fspan>Дисплей має вигляд стандартного\r\n                прямокутника із заокругленими кутами у красивому вигнутому\r\n                корпусі. Довжина діагоналі дисплея становить 6,27&nbsp;дюйма\r\n                (iPhone 18 Pro) або 6,86&nbsp;дюйма (iPhone 18 Pro Max), якщо\r\n                вимірювати між вершинами стандартного прямокутника. Фактична\r\n                зона перегляду менша.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">2\u003C\u002Fspan>Порівняно з iPhone попереднього\r\n                покоління.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">3\u003C\u002Fspan>Наведені характеристики залежать\r\n                від способу використання пристрою, мобільної мережі,\r\n                розташування, потужності сигналу, конфігурації та інших\r\n                чинників. Фактичний час роботи від акумулятора може не збігатися\r\n                з указаним. Кількість циклів заряджання акумулятора обмежена,\r\n                тому згодом може виникнути потреба в його заміні. Час роботи від\r\n                акумулятора та кількість циклів заряджання залежать від\r\n                конфігурації та особливостей використання пристрою. Тестування\r\n                акумуляторів проводилося на окремих контрольних зразках iPhone.\r\n                Детальніше на \u003Cspan class=\"ispc-u\">apple.com\u002Fbatteries\u003C\u002Fspan> і\r\n                \u003Cspan class=\"ispc-u\">apple.com\u002Fiphone\u002Fcompare\u003C\u002Fspan>.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">4\u003C\u002Fspan>Тестування проводила компанія Apple\r\n                у липні 2026 року на контрольних зразках iPhone 18 Pro та iPhone\r\n                18 Pro Max із версіями програмних засобів, що готувалися до\r\n                випуску, з використанням зарядного кабелю USB‑C або зарядних\r\n                пристроїв Apple MagSafe (модель A3502 — 1&nbsp;метр і модель\r\n                A3503 — 2&nbsp;метри) з динамічним адаптером живлення Apple\r\n                40&nbsp;Вт із максимальною потужністю 60&nbsp;Вт (модель A3351).\r\n                Підтримується швидке дротове заряджання за допомогою кабелю\r\n                USB-C з підтримкою потужності 60&nbsp;Вт і адаптерів живлення\r\n                USB PD 3.1 (або новіших версій) з можливістю регулювання напруги\r\n                (AVS). Тестування швидкого заряджання проводилося на розряджених\r\n                iPhone. Час заміряли з моменту появи логотипа Apple до запуску\r\n                пристрою. Фактична тривалість заряджання може не збігатися з\r\n                указаною, оскільки залежить від адаптера, налаштування,\r\n                використання, а також низки зовнішніх умов.\r\n              \u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n            \u003Cdiv class=\"ispc-lg__col\">\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">5\u003C\u002Fspan>Функція Apple Intelligence\r\n                доступна, якщо для мови Siri й пристрою встановлено китайську\r\n                (спрощену), китайську (традиційну), данську, нідерландську,\r\n                англійську, французьку, німецьку, італійську, японську,\r\n                корейську, норвезьку, португальську, іспанську, шведську,\r\n                турецьку або в’єтнамську мови. Деякі функції доступні не всіма\r\n                мовами та не в усіх регіонах. Деякі пристрої можуть бути\r\n                доступні не в усіх регіонах. Деякі функції Apple Intelligence,\r\n                що базуються на серверних моделях, мають щоденні обмеження на\r\n                використання, зокрема інтелектуальні інструменти редагування\r\n                фотографій, Image Playground і хмарні моделі AFM 3 у додатку\r\n                «Швидкі команди». Щоденні обмеження можуть відрізнятися залежно\r\n                від функції, складності запиту, навантаження на систему,\r\n                системних політик та інших факторів. У майбутньому розширений\r\n                доступ до таких функцій буде платний. Користування цими\r\n                функціями регулюється Умовами використання Apple Intelligence.\r\n                Детальніше на\r\n                \u003Cspan class=\"ispc-u\">apple.com\u002Fapple-intelligence\u003C\u002Fspan>.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">6\u003C\u002Fspan>Моделі iPhone 14 і новіші можуть\r\n                розпізнавати серйозні автомобільні аварії та викликати допомогу.\r\n                Потрібне підключення до мобільної мережі, супутниковий зв’язок\r\n                або виклики через Wi-Fi.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">7\u003C\u002Fspan>Технологія Wi‑Fi 7 доступна в\r\n                країнах і регіонах, де підтримується відповідний стандарт.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">8\u003C\u002Fspan>Потрібен тарифний план для\r\n                передавання даних. Технологія 5G доступна не в усіх країнах і\r\n                лише в деяких операторів мобільного зв’язку. Детальну інформацію\r\n                про підтримку 5G можна отримати в оператора мобільного зв’язку,\r\n                а також на \u003Cspan class=\"ispc-u\">apple.com\u002Fiphone\u002Fcellular\u003C\u002Fspan>.\r\n              \u003C\u002Fdiv>\r\n              \u003Cdiv class=\"ispc-lg__p\">\r\n                \u003Cspan class=\"ispc-sup\">9\u003C\u002Fspan>Для використання eSIM потрібен\r\n                оператор, що підтримує eSIM, і тарифний план для бездротового\r\n                зв’язку. По детальнішу інформацію звертайтеся до свого\r\n                оператора. Докладні відомості наведено на\r\n                \u003Cspan class=\"ispc-u\">apple.com\u002Fesim\u003C\u002Fspan>.\r\n              \u003C\u002Fdiv>\r\n            \u003C\u002Fdiv>\r\n          \u003C\u002Fdiv>\r\n        \u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fdiv>\r\n  \u003C\u002Fdiv>\r\n \u003C\u002Fdiv>",{"id":820,"type":821,"contentType":822,"data":823,"sort":29},1118382,"slogan","json","Ще більше Pro.",{"id":825,"type":826,"contentType":822,"data":827,"sort":34},1118398,"short_description","iPhone 18 Pro Max. Дисплей ProMotion 6,9 дюйма, основна камера Fusion 48 Мп зі змінною діафрагмою, найдовша робота акумулятора iPhone і чип A20 Pro.",{"id":829,"type":830,"contentType":822,"data":831,"sort":39},1118414,"feature_content","\u003Cp>\u003Cul>\u003Cli>ЧОТИРИ ВИРАЗНІ КОЛЬОРИ. ОДИН НАДІЙНИЙ КОРПУС. Створений надовго завдяки цільному алюмінієвому корпусу зі скляною задньою панеллю такого самого кольору — для більш гармонійного вигляду.\u003C\u002Fli>\u003Cli>ІМЕРСИВНИЙ ПРОФЕСІЙНИЙ ДИСПЛЕЙ. Дисплей Super Retina XDR 6,9 дюйма. Яскравіший. З кращим противідблисковим покриттям. Технологія ProMotion до 120 Гц.\u003C\u002Fli>\u003Cli>МІЦНА ПАНЕЛЬ CERAMIC SHIELD. І СПЕРЕДУ, І ЗЗАДУ. Створений надовго завдяки задній панелі Ceramic Shield і передній панелі Ceramic Shield 2, утричі стійкішій до подряпин, ніж в iPhone 16 Pro.\u003C\u002Fli>\u003Cli>ДОСКОНАЛА СИСТЕМА КАМЕР PRO. Основна камера Fusion 48 Мп зі змінною діафрагмою для ще кращих фото й відео за умов слабкого освітлення та неймовірної глибини різкості. Професійне налаштування. А також зум 8x оптичної якості.\u003C\u002Fli>\u003Cli>ФРОНТАЛЬНА КАМЕРА CENTER STAGE 18 МП. Різноманітні способи кадрування. Більше людей у фокусі. Відео з подвійним захопленням на фронтальну й основну камери. І ще багато іншого.\u003C\u002Fli>\u003Cli>ЧИП A20 PRO. Сила ШІ в дії. З паровою камерою нового покоління та подвійним 16-ядерним Neural Engine. Приріст продуктивності графічного процесора — до 40% порівняно з iPhone 17 Pro Max. Спеціально розроблений для штучного інтелекту.\u003C\u002Fli>\u003Cli>ПРОРИВ У ЧАСІ РОБОТИ ВІД АКУМУЛЯТОРА. До 6 годин більше відтворення відео порівняно з iPhone 17 Pro Max. До 30 годин роботи на одному заряді. Швидше дротове заряджання: до 50% за приблизно 15 хвилин із сумісним адаптером.\u003C\u002Fli>\u003Cli>APPLE INTELLIGENCE. Персональний, приватний і потужний. Пишіть, проявляйте індивідуальність і виконуйте завдання без зусиль.\u003C\u002Fli>\u003Cli>НАДВАЖЛИВІ ФУНКЦІЇ БЕЗПЕКИ. За допомогою функції «Виявлення аварій» iPhone може розпізнавати серйозні автомобільні аварії та викликати допомогу, коли ви не в змозі.\u003C\u002Fli>\u003Cli>БУДЬТЕ НА ЗВ’ЯЗКУ МАЙЖЕ ВСЮДИ. Користуйтеся швидшим зв’язком завдяки захищеним підключенням до мереж Wi-Fi 7, 5G та Bluetooth 6.\u003C\u002Fli>\u003Cli>ESIM. ГНУЧКІСТЬ. БЕЗПЕКА. ЗРУЧНІСТЬ. Інтегрована eSIM забезпечує захищене підключення без фізичної SIM-картки — ідеальний варіант для міжнародних подорожей.\u003C\u002Fli>\u003Cli>КОНФІДЕНЦІЙНІСТЬ. За допомогою Face ID можна безпечно розблоковувати телефон, входити в обліковий запис і здійснювати оплату.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fp>",{"id":833,"type":834,"contentType":822,"data":835,"sort":44},1113913,"learn_more_insurance",{"link":12,"text":836,"title":837,"nameLink":12},"\u003Cp>Обирайте розширену гарантію від iSpace та користуйтеся пристроєм без зайвих турбот!\u003C\u002Fp>\u003Cbr>\u003Ch3>Розширена гарантія - це:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у будь-якому гарантійному випадку\u003C\u002Fp>\u003Cp>✓ Необмежена кількість звернень щодо гарантійних поломок\u003C\u002Fp>\u003Cp>✓ Компенсація 100% вартості, якщо пристрій неможливо відремонтувати\u003C\u002Fp>\u003Cp>✓ Швидкі терміни обслуговування: діагностика — до 5 календарних днів, ремонт — до 14 календарних днів*\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ТА ОБМІН ГАДЖЕТА:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у разі механічного пошкодження або потрапляння рідини\u003C\u002Fp>\u003Cp>✓ Якщо пристрій не пошкоджено протягом року — сертифікат магазину на \u003Cstrong>70% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Якщо ремонт неможливий — сертифікат магазину на \u003Cstrong>50% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Термін дії — 1 або 2 роки з дати придбання\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ДИСПЛЕЯ ТА ЗАДНЬОЇ КРИШКИ iPhone:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Заміна пошкодженого дисплея на новий\u003C\u002Fp>\u003Cp>✓ Заміна пошкодженої задньої скляної панелі\u003C\u002Fp>\u003Cbr>\u003Cp>Ремонт проводиться виключно в авторизованих сервісних центрах Apple iSpace з використанням лише оригінальних запчастин\u003C\u002Fp>\u003Cbr>\u003Cp>*Терміни діагностики та ремонту діють після завершення воєнного стану. Пошкодження від рідини не покривається програмою Захист дисплея.\u003C\u002Fp>","Розширена гарантія від механічних пошкоджень",{"id":839,"type":840,"contentType":840,"data":841,"sort":49},1194474,"asbis-ui",{"data":842,"type":866,"component":12},{"id":843,"items":844,"title":861,"columns":29,"spacing":862,"textAlign":864,"expandMode":865,"description":12,"analyticsPlacement":12},"FaqSectionSimple",[845,849,853,857],{"tags":846,"answer":847,"question":848},[],"Так, iSpace — офіційний преміум-реселер Apple в Україні, тому ви можете купити iPhone 18 Pro Max, 2 TB, Silver з гарантією від виробника.","Чи є офіційна гарантія Apple в Україні?",{"tags":850,"answer":851,"question":852},[],"Так, в iSpace ми пропонуємо програми розстрочки під 0% без переплат на різні терміни.","Чи можна купити в розстрочку?",{"tags":854,"answer":855,"question":856},[],"Так, можливий самовивіз або доставка в будь-яке місто України. \u003Ca href=\"https:\u002F\u002Fispace.ua\u002Fpayment-delivery\">Детальніше про терміни та вартість доставки.\u003C\u002Fa>","Чи доступна доставка по Україні?",{"tags":858,"answer":859,"question":860},[],"Так, в iSpace лише оригінальна техніка Apple. Ми є офіційним реселером, тому гарантуємо справжність пристроїв і надаємо офіційну гарантію.","Чи оригінальний iPhone 18 Pro Max?","\u003Cspan style=\"color: rgb(23, 43, 77);font-size: 16px;letter-spacing: normal;\">\u003Cstrong>Питання та відповіді\u003C\u002Fstrong>\u003C\u002Fspan>",{"top":863,"bottom":863},"md","center","single","faq-section-simple",{"id":868,"type":869,"contentType":822,"data":870,"sort":227},1114113,"family-stripe",{"items":871},[872,875,877,879,881,883,885,887,889,891,893,895,896],{"entityId":873,"entityType":874},1436069,"product",{"entityId":876,"entityType":874},1436475,{"entityId":878,"entityType":874},1285072,{"en
