stems with 8‑core GPU and iMac (M1) systems with 7‑core GPU.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"rF2D7BD\" role=\"listitem\">\r\n                \u003Cdiv class=\"row nD5B41A large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column v992B7A large-12\">\u003Cp class=\"copy y840178 channel-custom-font-channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Up to 3.8x Faster than PC Laptop with Intel Core Ultra X7:\u003C\u002Fspan> Testing conducted by Apple in February 2026 using preproduction 15-inch MacBook Air systems with Apple M5, 10-core CPU, 10-core GPU, 16GB of unified memory, and 512GB SSD, as well as production Intel Core Ultra X7 300H Series-based PC systems with Intel Arc Graphics, 32GB of RAM, 1TB SSD, and the latest version of Windows 11 available at\r\n                      the time of testing. Time to first token measured with an 8K-token prompt using a 14-billion parameter model with 4-bit quantization, and LM Studio 0.4.2 (Build 2). Tested with equivalent display brightness settings for all units. Performance tests are conducted using specific computer systems and reflect the approximate performance of MacBook&nbsp;Air.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"jA252A3\" role=\"listitem\">\r\n                \u003Cdiv class=\"row o298C04 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column l780AEE large-12\">\u003Cp class=\"copy s84A641 channel-custom-font-channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Up to 6 More Hours Battery Life than the Intel‑Based MacBook Air (Up to 18 Hours Total):\u003C\u002Fspan> Compared with 1.1GHz dual-core Intel Core i3-based MacBook Air. Testing conducted by Apple in February 2020 using preproduction 1.1GHz dual-core Intel Core i3-based MacBook Air systems with 8GB of RAM and 256GB SSD. The iTunes movie playback test measures battery life by playing back HD 1080p content. Testing conducted by Apple\r\n                      in January 2026 using preproduction 13-inch MacBook Air systems with Apple M5, 10-core CPU, and 8-core GPU, and preproduction 15-inch MacBook Air systems with Apple M5, 10-core CPU, and 10-core GPU, all configured with 16GB of unified memory and 512GB SSD. Video streaming battery life tested with 1080p content. Equivalent display brightness settings used for all units. Battery life varies by use and configuration. See\r\n                      \u003Ca href=\"https:\u002F\u002Fwww.apple.com\u002Fbatteries\u002F\" class=\"footer-link\">\u003Cspan style=\"color: #424245; white-space: nowrap\">apple.com\u002Fbatteries\u003C\u002Fspan>\u003C\u002Fa> for more information.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"wDC446F\" role=\"listitem\">\r\n                \u003Cdiv class=\"row k9A0488 large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column v1742CD large-12\">\u003Cp class=\"copy mB34959 channel-custom-font-channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Up to 9.5x Faster than MacBook Air with M1:\u003C\u002Fspan> Testing conducted by Apple in January 2026 using preproduction 13-inch and 15-inch MacBook Air systems with Apple M5, 10-core CPU, 10-core GPU, 32GB of unified memory, and 4TB SSD, and production MacBook Air systems with Apple M1, 8-core CPU, 8-cor я творчих завдань. Потужна система Neural Engine і графічний процесор нового покоління з прискорювачами Neural Accelerators надають ефективну платформу для штучного інтелекту.\u003C\u002Fli>\u003Cli>ДО 18 ГОДИН БЕЗ ПІДЗАРЯДКИ. MacBook Air гарантує тривалий час роботи від акумулятора й високу продуктивність, що дає змогу працювати протягом усього дня без підзаряджання.\u003C\u002Fli>\u003Cli>ЧУДОВИЙ ДИСПЛЕЙ — Дисплей Liquid Retina підтримує 1 мільярд кольорів. Фотографії та відео відтворюються з високою контрастністю й чіткими деталями, а текст має надчіткий вигляд.\u003C\u002Fli>\u003Cli>КАМЕРА CENTER STAGE 12 МП. Автоматично залишайтеся в кадрі під час відеовикликів із функцією «Центрування в кадрі» або показуйте своє робоче місце зверху завдяки функції «Вид на стіл». Завдяки трьом мікрофонам і аудіосистемі з чотирьох динаміків із просторовим аудіо та Dolby Atmos звук завжди буде відмінним.\u003C\u002Fli>\u003Cli>ВСЕ ПІДКЛЮЧЕНО. MacBook Air оснащено двома портами Thunderbolt 4, зарядним портом MagSafe, портом для навушників, а також чипом Apple N1 для Wi-Fi 73 і Bluetooth 6. А ще до нього можна під’єднати до двох зовнішніх дисплеїв.\u003C\u002Fli>\u003Cli>ДОДАТКИ З MACOS ПРОСТО ЛІТАЮТЬ. Усі ваші улюблені додатки, включно зі встановленими, як-от FaceTime і Повідомлення, блискавично працюють з macOS. А інтегрований захист від вірусів і безплатні оновлення програмних засобів допомагають вашому Mac працювати безпечно та без збоїв.\u003C\u002Fli>\u003Cli>ЯКЩО ВИ ЛЮБИТЕ IPHONE, ВИ ПОЛЮБИТЕ MAC. Mac має магічний зв’язок з іншими пристроями Apple. Переглядайте вміст на екрані iPhone та керуйте ним із комп’ютера Mac за допомогою функції «Дублювання iPhone». Копіюйте контент на iPhone і вставляйте його на Mac. Спілкуйтесь у Повідомленнях або відповідайте на виклики FaceTime на Mac.\u003C\u002Fli>\u003C\u002Ful>",{"id":968,"type":969,"contentType":863,"data":970,"sort":193},990260,"short_description","\u003Cp>\u003Ca href=\"\u002Fcategory\u002Fmacbook-air\">MacBook Air\u003C\
