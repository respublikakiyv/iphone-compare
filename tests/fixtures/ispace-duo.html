nbsp;Intelligence Terms and Conditions. Learn more at \u003Ca href=\"https:\u002F\u002Fwww.apple.com\u002Fapple-intelligence\u002F\" class=\"footer-link\">\u003Cspan style=\"color: #424245; white-space: nowrap\">apple.com\u002Fapple‑intelligence\u003C\u002Fspan>\u003C\u002Fa>.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"ShDyBjxl\" role=\"listitem\">\r\n                \u003Cdiv class=\"row zETpWoms large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column uoFkhmry large-12\">\u003Cp class=\"copy LCyTTJxY channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Cellular and Wireless: \u003C\u002Fspan>Data plan required. 5G is available in select markets and through select carriers. Speeds vary based on site conditions and carrier. For details on 5G support, contact your carrier and see \u003Ca href=\"https:\u002F\u002Fwww.apple.com\u002Fiphone\u002Fcellular\u002F\" class=\"footer-link\">\u003Cspan style=\"color: #424245; white-space: nowrap\">apple.com\u002Fiphone\u002Fcellular\u003C\u002Fspan>\u003C\u002Fa>.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"xoLjkSpl\" role=\"listitem\">\r\n                \u003Cdiv class=\"row igemvoqP large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column oWpMiNsw large-12\">\u003Cp class=\"copy bRErlErH channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">Crash&nbsp;Detection: \u003C\u002Fspan>iPhone&nbsp;14 and later can detect a severe car crash and call for help. Requires a cellular connection or Wi‑Fi calling.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"nFlaQJAc\" role=\"listitem\">\r\n                \u003Cdiv class=\"row QozOQBrq large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column zSuKHNmf large-12\">\u003Cp class=\"copy ymulJJBM channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Display Size: \u003C\u002Fspan>The display has rounded corners that follow a beautiful curved design, and these corners are within a standard rectangle. When measured as a standard rectangular shape, the screen is 5.36&nbsp;inches (iPhone&nbsp;Duo, outer display), 5.42&nbsp;inches (iPhone&nbsp;13&nbsp;mini, iPhone&nbsp;12&nbsp;mini), 5.85&nbsp;inches (iPhone&nbsp;11&nbsp;Pro, iPhone&nbsp;XS, iPhone&nbsp;X), 6.06&nbsp;inches (iPhone&nbsp;17e, iPhone&nbsp;16e, iPhone&nbsp;14, iPhone&nbsp;13&nbsp;Pro, iPhone&nbsp;13, iPhone&nbsp;12&nbsp;Pro, iPhone&nbsp;12, iPhone&nbsp;11, iPhone&nbsp;XR), 6.12&nbsp;inches (iPhone&nbsp;16, iPhone&nbsp;15&nbsp;Pro, iPhone&nbsp;15, iPhone&nbsp;14&nbsp;Pro), 6.27&nbsp;inches (iPhone&nbsp;18&nbsp;Pro, iPhone&nbsp;17&nbsp;Pro, iPhone&nbsp;17, iPhone&nbsp;16&nbsp;Pro), 6.46&nbsp;inches (iPhone&nbsp;11&nbsp;Pro&nbsp;Max, iPhone&nbsp;XS&nbsp;Max), 6.55&nbsp;inches (iPhone&nbsp;Air), 6.68&nbsp;inches (iPhone&nbsp;14&nbsp;Plus, iPhone&nbsp;13&nbsp;Pro&nbsp;Max, iPhone&nbsp;12&nbsp;Pro&nbsp;Max), 6.69&nbsp;inches (iPhone&nbsp;16&nbsp;Plus, iPhone&nbsp;15&nbsp;Pro&nbsp;Max, iPhone&nbsp;15&nbsp;Plus, iPhone&nbsp;14&nbsp;Pro&nbsp;Max), 6.86&nbsp;inches (iPhone&nbsp;18&nbsp;Pro&nbsp;Max, iPhone&nbsp;17&nbsp;Pro&nbsp;Max, iPhone&nbsp;16&nbsp;Pro&nbsp;Max), or 7.58&nbsp;inches (iPhone&nbsp;Duo, inner folding display) diagonally. Actual viewable area is less.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"vLctdzyw\" role=\"listitem\">\r\n                \u003Cdiv class=\"row vRxwxavK large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column CoYGhAvG large-12\">\u003Cp class=\"copy RCFJNwuF channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">FaceTime: \u003C\u002Fspan>FaceTime calling requires a FaceTime‑enabled device for the caller and recipient and a Wi‑Fi connection. Availability over a cellular network depends on carrier policies; data charges may apply.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"GrvjFTmK\" role=\"listitem\">\r\n                \u003Cdiv class=\"row REvbNoAc large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column LqfZMzBw large-12\">\u003Cp class=\"copy HdFMvGuJ channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Fast Wired&nbsp;Charging: \u003C\u002Fspan>Testing conducted by Apple in July 2026 using preproduction iPhone&nbsp;Duo units and software, and either USB‑C&nbsp;Charge&nbsp;Cable or Apple&nbsp;MagSafe&nbsp;Chargers (1‑meter Model A3502 and 2‑meter Model A3503), both with Apple 40W Dynamic&nbsp;Power&nbsp;Adapter with 60W Max (Model A3351). Wired fast charge supported with 60W‑capable (or higher) USB‑C cable and USB&nbsp;PD power adapters. Fast‑charge\r\n                      testing conducted with drained iPhone&nbsp;Duo units in open configuration. Times measured from the appearance of the Apple logo as the unit started up. Charge time varies with adapter, settings, usage, and environmental factors; actual results will vary.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"jIWCRqzV\" role=\"listitem\">\r\n                \u003Cdiv class=\"row JehNCwtB large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column NAIXctxy large-12\">\u003Cp class=\"copy KysdQmtX channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">Feature, App, and Service Availability: \u003C\u002Fspan>Features are subject to change. Some features, applications, and services may not be available in all regions or languages.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"lFcuoUne\" role=\"listitem\">\r\n                \u003Cdiv class=\"row gsqKPkyF large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column lpXgNimV large-12\">\u003Cp class=\"copy kRWcNWvY channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">100 Percent Fiber‑Based Packaging: \u003C\u002Fspan>Based on retail packaging as shipped by Apple. Breakdown of U.S. retail packaging by weight. Adhesives, inks, and coatings are excluded from the calculations of plastic content and packaging weight.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"rgGVYPAC\" role=\"listitem\">\r\n                \u003Cdiv class=\"row DxdCWhAh large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column nizhqXsK large-12\">\u003Cp class=\"copy gtFKJHoI channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 113, 227, 100%)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Power and Battery: \u003C\u002Fspan>All battery claims depend on network configuration and many other factors; actual results will vary. Battery has limited recharge cycles and may eventually need to be replaced. Battery life and charge cycles vary by use and settings. See \u003Ca href=\"https:\u002F\u002Fwww.apple.com\u002Fiphone-duo\u002F\" class=\"footer-link\">\u003Cspan style=\"color: #424245; white-space: nowrap\">apple.com\u002Fiphone‑duo\u003C\u002Fspan>\u003C\u002Fa> for more information.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"uWSpIVpJ\" role=\"listitem\">\r\n                \u003Cdiv class=\"row BZZZbooz large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column NOQMSMzj large-12\">\u003Cp class=\"copy ilwaSqxc channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">Scratch&nbsp;Resistance: \u003C\u002Fspan>3x better scratch resistance of Ceramic&nbsp;Shield&nbsp;2 is compared with iPhone&nbsp;16 or earlier.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"fFOwszoz\" role=\"listitem\">\r\n                \u003Cdiv class=\"row FsNnQbrK large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column EVuMjCqQ large-12\">\u003Cp class=\"copy SHvSOgpc channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">Switching from an Android Phone: \u003C\u002Fspan>Download the Move&nbsp;to&nbsp;iOS&nbsp;app from Google&nbsp;Play.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"IkaXNJyW\" role=\"listitem\">\r\n                \u003Cdiv class=\"row YoeVImwQ large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column pvKhAWya large-12\">\u003Cp class=\"copy VzQuhYoP channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\u003Cspan style=\"font-weight: 500\">USB Transfer Speed: \u003C\u002Fspan>20x&nbsp;faster transfers for iPhone&nbsp;Duo, iPhone&nbsp;18&nbsp;Pro models, and iPhone&nbsp;17&nbsp;Pro models with USB&nbsp;3 compared with USB&nbsp;2. USB&nbsp;3 cable with 10Gb\u002Fs speed required.\u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n              \u003Cli class=\"jkHDcetl\" role=\"listitem\">\r\n                \u003Cdiv class=\"row otsaOtof large-display-bleed medium-display-bleed small-display-bleed\">\r\n                  \u003Cspan class=\"column ixvTefAy large-12\">\u003Cp class=\"copy zyGkmbyA channel-custom-font-custom-12-sosumi\" style=\"--focus-color: rgba(0, 125, 250, 0.6)\">\r\n                      \u003Cspan style=\"font-weight: 500\">Video Playback for iPhone&nbsp;Duo and iPhone&nbsp;18&nbsp;Pro Models: \u003C\u002Fspan>Testing conducted by Apple in July 2026 using preproduction iPhone&nbsp;Duo, iPhone&nbsp;18&nbsp;Pro, and iPhone&nbsp;18&nbsp;Pro&nbsp;Max units and software, subscribed to LTE and 5G carrier networks. Video playback consisted of a repeated 2‑hour 23‑minute HDR movie purchased from the iTunes&nbsp;Store. Video playback (streamed) consisted of a repeated 3‑hour\r\n                      1‑minute HDR movie purchased from the iTunes&nbsp;Store. All settings were default except: Bluetooth was paired with headphones; Wi‑Fi was associated with a network; the Wi‑Fi feature Ask to Join Networks, Auto‑Brightness, and True&nbsp;Tone were turned&nbsp;off.\r\n                    \u003C\u002Fp>\u003C\u002Fspan>\r\n                \u003C\u002Fdiv>\r\n              \u003C\u002Fli>\r\n            \u003C\u002Ful>\r\n          \u003C\u002Faside>\r\n        \u003C\u002Fdiv>\r\n      \u003C\u002Fdiv>\r\n    \u003C\u002Fdiv>\r\n   \u003C\u002Fdiv>",{"id":835,"type":836,"contentType":837,"data":838,"sort":29},1113897,"learn_more_insurance","json",{"link":12,"text":839,"title":840,"nameLink":12},"\u003Cp>Обирайте розширену гарантію від iSpace та користуйтеся пристроєм без зайвих турбот!\u003C\u002Fp>\u003Cbr>\u003Ch3>Розширена гарантія - це:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у будь-якому гарантійному випадку\u003C\u002Fp>\u003Cp>✓ Необмежена кількість звернень щодо гарантійних поломок\u003C\u002Fp>\u003Cp>✓ Компенсація 100% вартості, якщо пристрій неможливо відремонтувати\u003C\u002Fp>\u003Cp>✓ Швидкі терміни обслуговування: діагностика — до 5 календарних днів, ремонт — до 14 календарних днів*\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ТА ОБМІН ГАДЖЕТА:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у разі механічного пошкодження або потрапляння рідини\u003C\u002Fp>\u003Cp>✓ Якщо пристрій не пошкоджено протягом року — сертифікат магазину на \u003Cstrong>70% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Якщо ремонт неможливий — сертифікат магазину на \u003Cstrong>50% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Термін дії — 1 або 2 роки з дати придбання\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ДИСПЛЕЯ ТА ЗАДНЬОЇ КРИШКИ iPhone:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Заміна пошкодженого дисплея на новий\u003C\u002Fp>\u003Cp>✓ Заміна пошкодженої задньої скляної панелі\u003C\u002Fp>\u003Cbr>\u003Cp>Ремонт проводиться виключно в авторизованих сервісних центрах Apple iSpace з використанням лише оригінальних запчастин\u003C\u002Fp>\u003Cbr>\u003Cp>*Терміни діагностики та ремонту діють після завершення воєнного стану. Пошкодження від рідини не покривається програмою Захист дисплея.\u003C\u002Fp>","Розширена гарантія від механічних пошкоджень",{"id":842,"type":843,"contentType":843,"data":844,"sort":34},1194458,"asbis-ui",{"data":845,"type":869,"component":12},{"id":846,"items":847,"title":864,"columns":29,"spacing":865,"textAlign":867,"expandMode":868,"description":12,"analyticsPlacement":12},"FaqSectionSimple",[848,852,856,860],{"tags":849,"answer":850,"question":851},[],"Так, iSpace — офіційний преміум-реселер Apple в Україні, тому ви можете купити iPhone Duo, 256 ГБ, Star White з гарантією від виробника.","Чи є офіційна гарантія Apple в Україні?",{"tags":853,"answer":854,"question":855},[],"Так, в iSpace ми пропонуємо програми розстрочки під 0% без переплат на різні терміни.","Чи можна купити в розстрочку?",{"tags":857,"answer":858,"question":859},[],"Так, можливий самовивіз або доставка в будь-яке місто України. \u003Ca href=\"https:\u002F\u002Fispace.ua\u002Fpayment-delivery\">Детальніше про терміни та вартість доставки.\u003C\u002Fa>","Чи доступна доставка по Україні?",{"tags":861,"answer":862,"question":863},[],"Так, в iSpace лише оригінальна техніка Apple. Ми є офіційним реселером, тому гарантуємо справжність пристроїв і надаємо офіційну гарантію.","Чи оригінальний iPhone Duo?","\u003Cspan style=\"color: rgb(23, 43, 77);font-size: 16px;letter-spacing: normal;\">\u003Cstrong>Питання та відповіді\u003C\u002Fstrong>\u003C\u002Fspan>",{"top":866,"bottom":866},"md","center","single","faq-section-simple",{"id":871,"type":872,"contentType":837,"data":873,"sort":39},1113977,"banner_id",{"bannerId":874},3441,{"id":876,"type":877,"contentType":837,"data":878,"sort":44},1114097,"family-stripe",{"items":879},[880,883,884,886,888,890,892,894,896,898,900,902,903],{"entityId":881,"entityType":882},1436069,"product",{"entityId":647,"entityType":882},{"entityId":885,"entityType":882},1285072,{"entityId":887,"entityType":882},1042645,{"entityId":889,"entityType":882},1042670,{"entityId":891,"entityType":882},1042681,{"entityId":893,"entityType":882},895193,{"entityId":895,"entityType":882},893752,{"entityId":897,"entityType":882},893627,{"entityId":899,"entityType":882},895595,{"entityId":901,"entityType":882},895460,{"entityId":895,"entityType":882},{"entityId":904,"entityType":659},53425,{"id":906,"type":907,"contentType":837,"data":908,"sort":49},1115246,"tooltip",[909],{"text":910,"featureName":715},"\u003Ch2>Як дізнатися, скільки пам’яті ви використовуєте.\u003C\u002Fh2>\u003Cbr>\u003Cp>На вашому iPhone перейдіть у «Налаштування» > «Основні» > «Сховище iPhone», щоб дізнатися, скільки пам’яті ви використовуєте, як ви її використовуєте та скільки залишилось. На інших смартфонах перейдіть у «Налаштування» > «Пристрій» > «Сховище».\u003C\u002Fp>\u003Cbr>\u003Cp>Якщо ви майже вичерпали ліміт через велику кількість застосунків, музики чи фотографій, варто подумати про модель із більшим обсягом пам’яті.\u003C\u002Fp>\u003Cbr>\u003Cp>Якщо ви використовуєте мало пам’яті та рідко завантажуєте застосунки або не робите багато фотографій, iPhone із меншим обсягом пам’яті може бути найкращим вибором для вас.\u003C\u002Fp>",{"id":912,"type":913,"contentType":837,"data":914,"sort":227},1153887,"slogan","Привіт, Привіт.",{"id":916,"type":917,"contentType":837,"data":918,"sort":174},1113937,"delivery",[919,923,927,931],{"icon":920,"name":921,"details":922},"\u002Fcms\u002Fstatic-pages\u002Fd1\u002F87\u002Fd1879e182e5ad7b0c434d056bd338fe3\u002Fic_insurance_2.webp","Офіційна гарантія до 12 місяців","Надаємо лише оригінальну техніку з офіційною гарантією та підтримкою. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Fguarantee'>Детальніше",{"icon":924,"name":925,"details":926},"\u002Fcms\u002Fstatic-pages\u002F5a\u002F85\u002F5a8586fc2e067d0ead693cf13397dc02\u002Fic_services.webp","Усе для вашого пристрою","Допоможемо підібрати аксесуари, захист і сервіси одразу разом із пристроєм. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Faccessories'>Переглянути аксесуари",{"icon":928,"name":929,"details":930},"\u002Fcms\u002Fstatic-pages\u002F8b\u002F8f\u002F8b8f4e2c89a6c46b1c0cb815451936ba\u002Fic_returnrefund.webp","Налаштування при покупці","Підготуємо пристрій до використання одразу після покупки. \u003Cbr>\u003Cbr>\u003Ca href='https:\u002F\u002Fispace.ua\u002Fcategory\u002Fservices'>Наші послуги",{"icon":932,"name":933,"details":934},"\u002Fcms\u002Fstatic-pages\u002F28\u002Fb5\u002F28b5baee534ad193921eee20eb893faa\u002Fic_trade_in.webp","Підтримка після покупки","Допоможемо розібратися з функціями пристрою та впевнено користуватися ним після покупки.",{"id":936,"type":937,"contentType":837,"data":938,"sort":54},1153895,"feature_content","\u003Cp>\u003Cul>\u003Cli>НАЙБІЛЬШИЙ ДИСПЛЕЙ. У ТОНКОМУ СКЛАДАНОМУ КОРПУСІ. Найбільший дисплей в історії iPhone з нанотекстурою внутрішнього дисплея для зменшення відблисків. На 50% більший дисплей, ніж в iPhone 18 Pro Max.\u003C\u002Fli>\u003Cli>СКЛАДАЙТЕ. ВИСТАВЛЯЙТЕ. ВСТАНОВЛЮЙТЕ. Різні положення пристрою відкривають нові можливості роботи з iOS для підвищення продуктивності, багатозадачності та ефекту повного занурення під час перегляду.\u003C\u002Fli>\u003Cli>ПРЕКРАСНИЙ І МІЦНИЙ. iPhone Duo має рамку та накладку шарніра з титану п’ятого класу, а також передню панель Ceramic Shield 2 і задню панель Ceramic Shield.\u003C\u002Fli>\u003Cli>СИСТЕМА ДВОХ КАМЕР FUSION 48 Мп. Основна камера та надширококутна камера Fusion 48 Мп, а також цілком нові способи зйомки, зокрема функція «Вдалий знімок», яка автоматично фотографує.\u003C\u002Fli>\u003Cli>НОВІ ФУНКЦІЇ КАМЕРИ. Тепер із першою камерою FaceTime під дисплеєм і фронтальною камерою Center Stage 12 Мп.\u003C\u002Fli>\u003Cli>ПАРОВЕ ОХОЛОДЖЕННЯ. ПРОФЕСІЙНА ПРОДУКТИВНІСТЬ. Чип A20 Pro розроблено спеціально для завдань ШІ. 6-ядерний центральний процесор працює до 50% швидше, а 7-ядерний графічний процесор — до 2,1 раза швидше порівняно з iPhone 15 Pro.\u003C\u002Fli>\u003Cli>СИСТЕМА ДВОХ АКУМУЛЯТОРІВ. СИЛА НА УВЕСЬ ДЕНЬ. До 8 годин додаткового відтворення відео (порівняно з 23 годинами на iPhone 15 Pro) під час використання внутрішнього дисплея. До 21 години додаткового відтворення відео (порівняно з 23 годинами на iPhone 15 Pro) під час використання зовнішнього дисплея.\u003C\u002Fli>\u003Cli>APPLE INTELLIGENCE. Персональний, приватний і потужний. Пишіть, проявляйте індивідуальність і виконуйте завдання без зусиль.\u003C\u002Fli>\u003Cli>НАДВАЖЛИВІ ФУНКЦІЇ БЕЗПЕКИ. За допомогою функції «Виявлення аварій» iPhone може розпізнавати серйозні автомобільні аварії та викликати допомогу, коли ви не в змозі.\u003C\u002Fli>\u003Cli>НАДІЙНІШИЙ ЗВʼЯЗОК. БЛИСКАВИЧНІ ШВИДКОСТІ. Залишайтеся на зв’язку на вищих швидкостях завдяки шифрованим з’єднанням із Wi-Fi 7 Bluetooth 6, підключенню 5G, а також eSIM.9\u003C\u002Fli>\u003Cli>eSIM. ГНУЧКІСТЬ. БЕЗПЕКА. ЗРУЧНІСТЬ. iPhone Duo активується за допомогою eSIM.9 Завдяки eSIM ви отримуєте більшу гнучкість, зручність, підвищений рівень безпеки та безперебійний зв’язок, особливо під час міжнародних подорожей.\u003C\u002Fli>\u003Cli>КОНФІДЕНЦІЙНІСТЬ. За допомогою Touch ID можна безпечно розблоковувати телефон, входити в обліковий запис і здійснювати оплату.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fp>",{"id":940,"type":941,"contentType":837,"data":942,"sort":183},1153903,"short_description","iPhone Duo. Найбільший дисплей в історії iPhone. У тонкому складаному корпусі. Міцна титанова рамка.\nУнікальні здібності iOS. Система двох камер Fusion 48 Мп. Чип A20 Pro.",{"id":944,"type":945,"contentType":837,"data":946,"sort":188},1114057,"compare_link","https:\u002F\u002Fispace.ua\u002Fshare\u002Fcommon\u002Frc\u002FApple\u002FCompare_Page\u002FHTML_Compare_Module_iPhone\u002FUA\u002FCompare_iPhone_2026_2_current.html",{"id":948,"type":949,"contentType":837,"data":950,"sort":193},1114017,"custom_badge","\u003Cspan style='color:#0071BC'>TRADE-IN\u003C\u002Fspan>",{"id":952,"type":953,"contentType":837,"data":954,"sort":282},1114137,"promo-carousel",{"isAddToCart":577,"categoryPromo":955},"quick-chekout-main",[],[958,966],{"kind":34,"items":959},[960],{"id":961,"name":962,"kind":34,"crmId":963,"sku":964,"slug":965,"price":12,"finalPrice":12,"serviceDiscount":183,"photoUrl":12},891263,"Сервісний захист і обмін пристрою","220818100113970274","ION_WARRANTY_GADGET_PROTECTION","service-gadget-protection-and-exchange-ion-warranty-gadget-protection",{"kind":39
