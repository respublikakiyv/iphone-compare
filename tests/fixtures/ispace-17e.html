eight(mm)":814,"packWeightBrutto(kg)":815},"A","https:\u002F\u002Feprel.ec.europa.eu\u002Fscreen\u002Fproduct\u002Fsmartphonestablets20231669\u002F2556297","166 мм","89.5 мм","26 мм","0.326 кілограм",[],"APPLE",[819,824,830,836,865,895,901,921,925,929,933,937,941],{"id":820,"type":821,"contentType":822,"data":823,"sort":7},985168,"marketing_type","html","\u003Cp style=\"height: 0px; margin: 0px;\">\u003Cstyle type=\"text\u002Fcss\">\r\n  #sevntne { container-type: inline-size; }\r\n  #sevntne iframe { display: block; width: 100%; border: 0; background-color: #fff; height: 11217px; }\r\n  @container (min-width: 329px) { #sevntne iframe { height: 11153px; } }\r\n  @container (min-width: 366px) { #sevntne iframe { height: 10977px; } }\r\n  @container (min-width: 735px) { #sevntne iframe { height: 7878px; } }\r\n  @container (min-width: 1069px) { #sevntne iframe { height: 9182px; } }\r\n\u003C\u002Fstyle>\u003C\u002Fp>\r\n\u003Cdiv id=\"sevntne\">\u003Ciframe src=\"https:\u002F\u002Fcf.value4it.com\u002Fshare\u002Fcommon\u002Frc\u002FApple\u002FiPhone%2017e\u002Findex.html\">\u003C\u002Fiframe>\u003C\u002Fdiv>",{"id":825,"type":826,"contentType":827,"data":828,"sort":29},986200,"banner_id","json",{"bannerId":829},3244,{"id":831,"type":832,"contentType":827,"data":833,"sort":34},1101410,"learn_more_insurance",{"link":12,"text":834,"title":835,"nameLink":12},"\u003Cp>Обирайте розширену гарантію від iSpace та користуйтеся пристроєм без зайвих турбот!\u003C\u002Fp>\u003Cbr>\u003Ch3>Розширена гарантія - це:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у будь-якому гарантійному випадку\u003C\u002Fp>\u003Cp>✓ Необмежена кількість звернень щодо гарантійних поломок\u003C\u002Fp>\u003Cp>✓ Компенсація 100% вартості, якщо пристрій неможливо відремонтувати\u003C\u002Fp>\u003Cp>✓ Швидкі терміни обслуговування: діагностика — до 5 календарних днів, ремонт — до 14 календарних днів*\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ТА ОБМІН ГАДЖЕТА:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Безкоштовний ремонт у разі механічного пошкодження або потрапляння рідини\u003C\u002Fp>\u003Cp>✓ Якщо пристрій не пошкоджено протягом року — сертифікат магазину на \u003Cstrong>70% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Якщо ремонт неможливий — сертифікат магазину на \u003Cstrong>50% вартості пристрою\u003C\u002Fstrong>\u003C\u002Fp>\u003Cp>✓ Термін дії — 1 або 2 роки з дати придбання\u003C\u002Fp>\u003Cbr>\u003Ch3>ЗАХИСТ ДИСПЛЕЯ ТА ЗАДНЬОЇ КРИШКИ iPhone:\u003C\u002Fh3>\u003Cbr>\u003Cp>✓ Заміна пошкодженого дисплея на новий\u003C\u002Fp>\u003Cp>✓ Заміна пошкодженої задньої скляної панелі\u003C\u002Fp>\u003Cbr>\u003Cp>Ремонт проводиться виключно в авторизованих сервісних центрах Apple iSpace з використанням лише оригінальних запчастин\u003C\u002Fp>\u003Cbr>\u003Cp>*Терміни діагностики та ремонту діють після завершення воєнного стану. Пошкодження від рідини не покривається програмою Захист дисплея.\u003C\u002Fp>","Розширена гарантія від механічних пошкоджень",{"id":837,"type":838,"contentType":838,"data":839,"sort":39},1194290,"asbis-ui",{"data":840,"type":864,"component":12},{"id":841,"items":842,"title":859,"columns":29,"spacing":860,"textAlign":862,"expandMode":863,"description":12,"analyticsPlacement":12},"FaqSectionSimple",[843,847,851,855],{"tags":844,"answer":845,"question":846},[],"Так, iSpace — офіційний преміум-реселер Apple в Україні, тому ви можете купити iPhone 17e, 256 ГБ, Soft Pink з гарантією від виробника.","Чи є офіційна гарантія Apple в Україні?",{"tags":848,"answer":849,"question":850},[],"Так, в iSpace ми пропонуємо програми розстрочки під 0% без переплат на різні терміни.","Чи можна купити в розстрочку?",{"tags":852,"answer":853,"question":854},[],"Так, можливий самовивіз або доставка в будь-яке місто України. \u003Ca href=\"https:\u002F\u002Fispace.ua\u002Fpayment-delivery\">Детальніше про терміни та вартість доставки.\u003C\u002Fa>","Чи доступна доставка по Україні?",{"tags":856,"answer":857,"question":858},[],"Так, в iSpace лише ор 17, але за доступною ціною.\u003C\u002Fli>\u003Cli>КНОПКА ДІЇ. Швидкий персоналізований доступ до улюблених додатків і функцій.\u003C\u002Fli>\u003Cli>СТВОРЕНИЙ НАДОВГО. iPhone 17e захищено передньою панеллю Ceramic Shield 2, яка втричі стійкіша до подряпин, ніж попереднє покоління.\u003C\u002Fli>\u003Cli>НЕЙМОВІРНИЙ ДИСПЛЕЙ. Дисплей Super Retina XDR 6,1 дюйма робить фото виразними і полегшує читання тексту. Семишарове противідблискове покриття зменшує відблиски навіть на яскравому сонці.\u003C\u002Fli>\u003Cli>ЦІЛИЙ ДЕНЬ РОБОТИ ВІД АКУМУЛЯТОРА. Пишіть повідомлення, переглядайте вебсторінки та дивіться фільми й серіали годинами без перерви. Швидко заряджайтеся через USB-C, а тепер ще й із MagSafe.\u003C\u002Fli>\u003Cli>ШВИДКЕ БЕЗДРОТОВЕ ЗАРЯДЖАННЯ. УСЕ ВМИТЬ ІЗ MAGSAFE. iPhone 17e забезпечує бездротове заряджання до 15 Вт, тоді як iPhone 16e — лише до 7,5 Вт. Тому заряджати просто, зручно й швидко.\u003C\u002Fli>\u003Cli>ЧИП A19. НЕВТОМНО ВРАЖАЄ. Чип A19 забезпечує неймовірну швидкість і плавність у всьому, що ви робите, — від потужних AAA-ігор до потокових відео 4K та багато іншого.\u003C\u002Fli>\u003Cli>ДВІ ДОСКОНАЛІ КАМЕРИ В ОДНІЙ. Система камер Fusion 48 Mп із зумом 2х оптичної якості. А з портретами наступного покоління можна зафіксувати момент, а пізніше перетворити його на ефектний портрет, додавши розмиття тла.\u003C\u002Fli>\u003Cli>БІЛЬШЕ МІСЦЯ ДЛЯ УСЬОГО ВАЖЛИВОГО. З об’ємом пам’яті від 256 ГБ у вас вистачить місця для всього, що ви любите, сьогодні і в майбутньому — від надвисокоякісних фото та 4K-відео до улюблених додатків, ігор та іншого.\u003C\u002Fli>\u003Cli>НАДВАЖЛИВІ ФУНКЦІЇ БЕЗПЕКИ. За допомогою функції «Виявлення аварій» iPhone може розпізнавати серйозні автомобільні аварії та викликати допомогу, коли ви не в змозі.\u003C\u002Fli>\u003Cli>IOS 26. НОВИЙ ВИГЛЯД. ЩЕ БІЛЬШЕ МАГІЇ. iOS 26 пропонує яскравий новий дизайн і потужні оновлення — від функції Liquid Glass та «Фільтрування виклику» до оновленого додатка «Повідомлення» та перероблених інтерфейсів, які стали ще красивішими.\u003C\u002Fli>\u003Cli>КОНФІДЕНЦІЙНІСТЬ. За допомогою Face ID можна безпечно розблоковувати телефон, входити в обліковий запис і здійснювати оплату.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fp>",{"id":938,"type":939,"contentType":827,"data":940,"sort":193},986221,"short_description","\u003Cp>\u003Ca href=\"\u002Fcategory\u002Fiphone-17e\">iPhone 17e\u003C\u002Fa>. iPhone 17e оснащено чудовим дисплеєм Super Retina XDR 6,1 дюйма, швидким і потужним чипом A19, акумулятором, що забезпечує роботу протягом усього дня та 256 ГБ початкової пам’яті",{"id":942,"type":943,"contentType":827,"data":944,"sort":282},986206,"promo-carousel",{"isAddToCart":577,"categoryPromo":945},"quick-chekout-main",[],[948,958],{"kind":34,"items":949},[950],{"id":951,"name":952,"kind":34,"crmId":953,"sku":954,"slug":955,"price":956,"finalPrice":957,"serviceDiscount":183,"photoUrl":12},891263,"Сервісний захист і обмін пристрою","220818100113970274","ION_WARRANTY_GADGET_PROTECTION","service-gadget-protection-and-exchange-ion-warranty-gadget-protection",4599.9,3999.9,{"kind":39,"items":959},[960,968],{"id":961,"name":962,"kind":39,"crmId":963,"sku":964,"slug":965,"price":966,"finalPrice":967,"serviceDiscount":49,"photoUrl":12},891261,"+1 рік додаткової гарантії","220818100113109981","ION_WARRANTY_1_YEAR","service-ion-warranty-1-year",2759.94,2399.94,{"id":969,"name":970,"kind":39,"crmId":971,"sku":972,"slug":973,"price":974,"finalPrice":975,"serviceDiscount":193,"photoUrl":12},891262,"+2 роки додаткової гарантії","220818100113539025","ION_WARRANTY_2_YEAR","service-ion-warranty-2-year",5519.88,4799.88,[977,989,1003],{"featureId":978,"featureName":697,"featureNameEn":12,"featureType":12,"externalCfId":698,"blockType":979,"items":980},837549,"feature",[981],{"id":647,"slug":650,"sku":645,"crmId":648,"status":7,"price":652,"priceCat1":655,"priceCat2":12,"priceCat3":12,"priceCat4":12,"priceCat5":12,"customBadges":12,"marks":982,"photoUrl":683,"stock":227,"sumStock":287,"
